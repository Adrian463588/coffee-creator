syntax = "proto3";
option java_package = "com.coffeecreator.app.preferences";
option java_multiple_files = true;

message AppPreferences {
  string theme = 1;
  uint32 max_tokens = 2;
  float temperature = 3;
  bool onboarded = 4;
  // Versioned local timer checkpoint and cue preferences. Existing field numbers remain unchanged.
  string brew_timer_state = 5;
}
