name: Android quality
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Pinned Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Verify bundled assets
        run: python scripts/prepare_assets.py
      - name: Static, unit and APK gates
        run: bash gradlew :app:lintDebug :app:detekt :app:ktlintCheck :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Verify native APK structure
        run: python scripts/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Native boundary contracts
        run: |
          mkdir -p artifacts
          for name in gguf_guard gemma4_text prompt_guard; do
            g++ -std=c++17 -Wall -Wextra -Werror app/src/main/cpp/tests/${name}_test.cpp -o artifacts/${name}-test
          done
          artifacts/gguf_guard-test artifacts/owned-gguf-test.qa
          artifacts/gemma4_text-test
          artifacts/prompt_guard-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-reports-and-debug-apk
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/debug/
          retention-days: 14
